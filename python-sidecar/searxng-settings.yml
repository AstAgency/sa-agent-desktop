# SearXNG settings template for SA-Agent Desktop.
#
# The launcher (electron/searxng-runtime.ts) copies this file into the
# user data directory at startup, then overrides server.secret_key,
# server.bind_address, and server.port with values it picks at runtime.
#
# Engine selection: SearXNG is a metasearch, so stability depends on each
# adapter. From a self-hosted instance without residential IPs, the major
# scrapers (DuckDuckGo, Google, Startpage, Yahoo) trigger CAPTCHA or
# disconnect mid-stream after a few queries. We deliberately pick engines
# that either expose a real API or are tolerant of small instances.

use_default_settings:
  engines:
    keep_only:
      - brave
      - mojeek
      - qwant
      - wikipedia
      - wikidata
      - bing
      - github
      - stackoverflow

general:
  debug: false
  instance_name: "SA-Agent local search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

server:
  # bind_address, port and secret_key are overwritten by the launcher.
  bind_address: "127.0.0.1"
  port: 8888
  secret_key: "REPLACED_AT_RUNTIME"
  base_url: false
  limiter: false
  public_instance: false
  image_proxy: false
  http_protocol_version: "1.0"
  method: "GET"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: true
  default_locale: en
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  cache_url: https://web.archive.org/web/
  default_theme: simple
  theme_args:
    simple_style: auto

# Conservative outgoing settings — we are a single user, not a public
# instance. Keeping the pool small and disabling HTTP/2 reduces the chance
# of SearXNG looking like a bot to upstream engines.
outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
  pool_connections: 10
  pool_maxsize: 10
  enable_http2: false

engines:
  - name: brave
    disabled: false
    timeout: 6.0
  - name: mojeek
    disabled: false
    timeout: 6.0
  - name: qwant
    disabled: false
    timeout: 6.0
  - name: wikipedia
    disabled: false
    timeout: 4.0
  - name: wikidata
    disabled: false
    timeout: 6.0
  - name: bing
    disabled: false
    timeout: 5.0
  - name: github
    disabled: false
    timeout: 5.0
  - name: stackoverflow
    disabled: false
    timeout: 5.0
