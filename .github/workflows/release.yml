name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            artifact_name: installers-macos-arm64
            artifact_glob: release/*.zip
          - os: macos-15-intel
            label: macOS (Intel)
            artifact_name: installers-macos-x64
            artifact_glob: release/*.zip
          # - os: ubuntu-latest
          #   label: Linux
          #   artifact_name: installers-linux
          #   artifact_glob: |
          #     release/*.tar.gz
          #     release/*.deb
          - os: windows-2025
            label: Windows
            artifact_name: installers-windows
            artifact_glob: release/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: npm ci

      - name: Validate production environment variables
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          VITE_AUTH_BASE_URL: ${{ vars.VITE_AUTH_BASE_URL || secrets.VITE_AUTH_BASE_URL }}
        run: |
          set -euo pipefail
          [[ -n "${VITE_API_BASE_URL}" ]] || { echo "Missing VITE_API_BASE_URL in prod environment"; exit 1; }
          [[ -n "${VITE_AUTH_BASE_URL}" ]] || { echo "Missing VITE_AUTH_BASE_URL in prod environment"; exit 1; }

      - name: Build bundled Python runtime
        run: npm run python:build

      - name: Build installers
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          VITE_AUTH_BASE_URL: ${{ vars.VITE_AUTH_BASE_URL || secrets.VITE_AUTH_BASE_URL }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_CACHE: ./.cache/electron
          ELECTRON_BUILDER_CACHE: ./.cache/electron-builder
        run: npm run dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
